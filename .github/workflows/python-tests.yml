
name: Testes Python e Segurança

on:
  push:
    branches: [main, develop, feature/seguranca-pipeline]
  pull_request:
    branches: [main, develop]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar testes automatizados
        run: python -m unittest -v

  sast:
    name: Análise de Segurança SAST
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Bandit
        run: python -m pip install bandit

      - name: Executar análise SAST
        run: bandit -r . -x ./test_main.py
